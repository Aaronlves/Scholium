name: Verify

# Daily checks retain the repository guards and correctness suites. Full
# verification is explicitly selected before a beta, followed by the owning
# local/package gates. Tagging an already verified commit starts no duplicate run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Verification scope (full is required before beta publication)
        type: choice
        options: [full, daily]
        default: full
        required: true

# Superseded daily pushes stop consuming runners. Explicit full verification
# has a separate group and is allowed to finish even while development advances.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'daily' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.profile == 'daily' }}

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    # Scholium is built for the machine it is written on, and reaches for macOS
    # 27 controls where they exist. #available guards those calls at runtime but
    # the symbols still have to be in the SDK to compile, so the runner needs
    # Xcode 27's. This label is a public preview image; if it is withdrawn the
    # gate has to follow the toolchain rather than retreat to an older SDK.
    # Pinned rather than macos-latest either way, so the image cannot change
    # underneath a byte-comparison of the committed editor bundles.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # run-editor-toolchain.sh installs lockfile-pinned npm dependencies in
      # isolated .build staging and excludes the worktree's node_modules.
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      # Core count is part of the toolchain here: Swift's cooperative pool is
      # sized to it, and several suites coordinate across concurrent tasks.
      - name: Report the toolchain
        run: |
          echo "DEVELOPER_DIR=$(Tools/Scripts/resolve-xcode-developer-dir.sh)"
          echo "cores=$(sysctl -n hw.ncpu) memory=$(sysctl -n hw.memsize)"
          sw_vers
          swift --version
          node --version
          python3 --version

      - name: Verify
        # Shared CI cannot witness calibrated local timing or the required
        # display/font/input setup. Those declarations remain reported skips;
        # the full gate must also run on a suitable development Mac before release.
        env:
          SCHOLIUM_SKIP_MEASUREMENT_EVIDENCE: "1"
          SCHOLIUM_SKIP_DISPLAY_EVIDENCE: "1"
          SCHOLIUM_VERIFY_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'daily' }}
        run: |
          case "$SCHOLIUM_VERIFY_PROFILE" in
            daily) Tools/Scripts/verify.sh --ci ;;
            full) Tools/Scripts/verify.sh ;;
            *) echo "Unknown verification profile" >&2; exit 64 ;;
          esac

      # verify.sh writes each failing step's full log under .build; the console
      # only carries the tail of it.
      - name: Collect verification logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-logs
          path: |
            .build/verification/**/*.log
            .build/verification-release/**/*.log
          if-no-files-found: ignore
          retention-days: 14
