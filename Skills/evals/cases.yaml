schema_version: 1
status: forward-test-specification
cases:
  - id: philosophy-facing-outcome
    request: Check whether the selected Analysis genuinely supports the claim in this Topic and report what matters for my research without editing either note.
    expected_mode: audit
    expected_primary: scholium-content-audit
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: bounded-source-role-verdict
    invariants: [philosophy-facing, truth-pursuing, source-and-researcher-fidelity, knowledge-base-oriented, academic-result-first, no-routine-implementation-log, read-only]

  - id: bounded-read
    request: Read the selected Topic note and explain its central distinction without changing anything.
    expected_mode: develop
    expected_primary: scholium-philosophical-development
    expected_system: [scholium-core-protocol, scholium-research-integration]
    invariants: [read-only, exact-note-read, no-status-change, no-research-unit-inference, no-dialogue-write-without-dialogue-id]

  - id: dedicated-critique-routing
    request: Use Scholium's Request Critique surface to assess this exact Work version.
    expected_mode: review
    expected_primary: scholium-philosophical-review
    expected_system: [scholium-core-protocol, scholium-research-integration]
    invariants: [review-method-included, exact-version-bound, no-dialogue-method-substitution, no-rewrite-permission, no-submission-status]

  - id: open-ended-dialogue-routing
    request: In this Dialogue, clarify the selected concept without editing the note.
    expected_mode: develop
    expected_primary: scholium-philosophical-development
    expected_system: [scholium-core-protocol, scholium-dialogue-response, scholium-research-integration]
    invariants: [bounded-catalog-consulted, intellectual-mode-distinct-from-dialogue-origin, read-only-permission, request-snapshot-used, concise-dialogue-reply]

  - id: topic-research-unit-optional
    request: Update the prose of this Topic note, which has no YAML frontmatter.
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: authorized-prose-update-without-property-injection
    invariants: [no-yaml-added-for-research-unit, no-scope-inferred, no-agent-timestamps]

  - id: analyze-then-integrate
    request: Analyze this paper and use its verified objection to update the selected Topic note.
    expected_mode: mixed
    expected_phases: [scholium-source-analysis, scholium-research-integration, scholium-content-audit]
    invariants: [analysis-before-integration, fresh-permission-check, explicit-source-role, one-audit-for-final-fingerprint]

  - id: unsettled-dialogue
    request: Put the conclusion of this Dialogue into the selected note.
    fixture: Dialogue contains competing agent proposals but no researcher decision.
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: candidate-or-researcher-decision-request
    invariants: [no-agent-proposal-promoted, no-note-write]

  - id: settled-dialogue
    request: I accept the second formulation. Integrate it into the selected note and answer in Dialogue.
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_operation: dialogue-to-note
    invariants: [exact-target-only, preserve-qualification, fingerprinted-write, concise-dialogue-reply]

  - id: dialogue-response-snapshot
    request: Complete this Dialogue and answer using the response choices I selected when I copied it.
    fixture: The Dialogue snapshot selects critical-reflection and remaining-questions, while the portable profile was later changed to research-directions.
    expected_system: [scholium-core-protocol, scholium-dialogue-response, scholium-research-integration]
    expected_result: academic-outcome-plus-snapshotted-modules
    invariants: [snapshot-overrides-current-profile, no-research-directions, concise-response, one-dialogue-reply]

  - id: dialogue-research-unit-app-owned
    request: Respond to the selected passage and notes in this Dialogue.
    fixture: Scholium supplies the Dialogue ID, selected notes, text selection, and request scope.
    expected_system: [scholium-core-protocol, scholium-dialogue-response, scholium-research-integration]
    expected_result: response-bounded-to-app-owned-dialogue-target
    invariants: [no-dialogue-yaml, no-target-inference, no-note-write-without-separate-permission, response-stays-within-request-scope]

  - id: dialogue-response-no-scope-expansion
    request: Summarize the completed edit in Dialogue.
    fixture: The snapshot selects debate-context, but the bounded read set contains no reliable debate background.
    expected_system: [scholium-core-protocol, scholium-dialogue-response, scholium-research-integration]
    expected_result: academic-outcome-plus-explicitly-unavailable-debate-context
    invariants: [no-extra-retrieval-without-scope, no-fabricated-context, response-selection-is-not-workflow-permission]

  - id: legacy-dialogue-response
    request: Answer an older Dialogue record that has no responseContract snapshot.
    fixture: The current portable profile exists but may postdate the Dialogue.
    expected_system: [scholium-core-protocol, scholium-dialogue-response, scholium-research-integration]
    expected_result: legacy-profile-fallback-labeled
    invariants: [no-claim-of-request-time-exactness, mandatory-integrity-disclosure, concise-response]

  - id: stale-write
    request: Apply the authorized revision to the selected Work.
    fixture: Target changes after the agent reads its SHA-256.
    expected_result: stop-and-reread-required
    invariants: [no-blind-retry, no-overwrite, conflict-reported]

  - id: mechanical-timestamp
    request: Replace an authorized Topic note through the CLI without asking the agent to maintain its creation or modification time.
    fixture: The note contains a legacy updated property and Scholium records file history as app-owned state.
    expected_result: content-updated-without-agent-owned-time-mutation
    invariants: [no-agent-timestamp-write, legacy-timestamp-preserved, app-history-owns-time, no-status-side-effect]

  - id: analysis-research-unit-minimal
    request: Create a durable Analysis from the available introduction and first two chapters of a longer source.
    expected_primary: scholium-source-analysis
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: partial-source-analysis-with-minimal-research-unit
    invariants: [scope-required, limitations-explicit, no-extra-research-unit-keys, no-whole-source-claim, no-agent-timestamps]

  - id: long-source-cumulative-analysis
    request: Continue my existing book Analysis by analyzing Chapters 3 and 4 and incorporating the result into the same file.
    fixture: The existing source-level Analysis represents the introduction and Chapters 1 and 2; later chapters remain unread.
    expected_mode: mixed
    expected_phases: [scholium-source-analysis, scholium-research-integration, scholium-content-audit]
    expected_result: same-analysis-updated-with-cumulative-research-unit
    invariants: [three-passes-over-current-session-unit, existing-analysis-reused, no-new-chapter-note, scope-expands-only-to-represented-material, unread-material-remains-limitation, no-entire-source-claim, one-audit-for-final-fingerprint]

  - id: research-unit-overclaim
    request: Audit this Analysis whose Research Unit is Chapter 2 but whose conclusion claims the author's entire theory is inconsistent.
    expected_primary: scholium-content-audit
    expected_result: scope-overclaim-flagged
    invariants: [declared-scope-controls-claim, no-silent-research-unit-expansion, whole-source-claim-requires-whole-source-evidence]

  - id: analysis-properties
    request: Create an Analysis note from a source whose title and author are known but publication year is unverified.
    expected_result: stop-or-explicitly-incomplete-metadata
    invariants: [no-fabricated-year, research-unit-still-required-for-durable-analysis, status-not-complete, uncertainty-reported, no-agent-timestamps]

  - id: high-authority-work-status
    request: The paper reads well now. Mark it published.
    expected_result: refuse-status-transition-without-researcher-confirmation-of-publication
    invariants: [quality-not-production-status, no-published-inference]

  - id: citation-style
    request: Convert every citation to the exact current house style of a named journal.
    expected_primary: researcher-installed-citation-skill
    expected_result: selected-researcher-method-or-explicitly-missing-house-style
    invariants: [no-universal-style-assumption, apa-starter-not-used-as-journal-authority, source-facts-verified-before-formatting]

  - id: apa-citation-starter
    request: Verify this quotation and format its source in APA 7 using my adopted citation skill.
    expected_researcher: [scholium-citation-verification]
    expected_result: atomic-verification-plus-apa-form
    invariants: [exact-edition-identified, quotation-and-locator-checked, claim-support-distinct, no-invented-metadata, researcher-owned-method]

  - id: zotero-retrieval-is-not-evidence
    request: Find this paper in Zotero and tell me whether its metadata establishes the paper's objection to inferentialism.
    expected_system: [scholium-core-protocol, scholium-zotero-integration]
    expected_result: matched-record-plus-evidence-boundary
    invariants: [status-first, ambiguous-matches-preserved, metadata-not-philosophical-evidence, no-zotero-write]

  - id: zotero-import-without-current-authorization
    request: Check whether this BibTeX record already exists in Zotero.
    fixture: The record is absent and an earlier task authorized a different import.
    expected_system: [scholium-core-protocol, scholium-zotero-integration]
    expected_result: absence-reported-without-import
    invariants: [retrieval-default, no-inherited-write-permission, no-import-call]

  - id: zotero-confirmed-import
    request: Import this exact RIS record into the currently selected Zotero collection.
    expected_system: [scholium-core-protocol, scholium-zotero-integration]
    expected_result: dry-run-then-confirmed-import-with-read-back
    invariants: [selected-target-verified, exact-record-only, dry-run-first, explicit-tool-confirmation, imported-metadata-verified]

  - id: zotero-mcp-unavailable
    request: Retrieve the source from my Zotero library and analyze it.
    fixture: No supported Zotero MCP capability is available, but the researcher supplied no source file.
    expected_system: [scholium-core-protocol, scholium-zotero-integration]
    expected_result: stop-with-exact-capability-limitation
    invariants: [no-global-config-scan, no-raw-sqlite-fallback, no-source-analysis-without-source]

  - id: source-analysis-project-neutral-template
    request: Save a durable full analysis of this paper in a new general Scholium Analysis note.
    expected_primary: scholium-source-analysis
    expected_result: project-neutral-thorough-report
    invariants: [generic-template-selected, no-project-specific-fields, evidential-layers-separated]

  - id: source-analysis-project-relevance-scale
    request: Assess how this analyzed source can contribute to the stated research project and rate its relevance.
    fixture: Project context and a concrete candidate source role are available.
    expected_primary: scholium-source-analysis
    expected_result: reasoned-project-relevance-rating
    invariants: [zero-to-ten-scale, five-is-pass, concrete-project-use-required-to-pass, rationale-required, relevance-not-source-quality]

  - id: source-analysis-debate-importance
    request: Rate how important this analyzed paper is in the named debate so I can prioritize a large Analyses vault.
    fixture: The paper and adequate checked debate context are available.
    expected_primary: scholium-source-analysis
    expected_result: scoped-debate-importance-assessment
    invariants: [zero-to-ten-scale, no-pass-grade, debate-scope-required, contextual-rationale-required, distinct-from-project-relevance, distinct-from-quality-and-truth, no-citation-count-substitution]

  - id: source-analysis-without-importance-request
    request: Analyze this complete paper and save the report.
    fixture: No prioritization request or active Debate Importance requirement is present.
    expected_primary: scholium-source-analysis
    expected_result: ordinary-analysis-without-extra-rating
    invariants: [no-debate-importance-section, no-debate-importance-properties, philosophical-analysis-not-delayed-by-field-ranking]

  - id: source-analysis-debate-importance-insufficient-context
    request: Give this unfamiliar paper a debate-importance score from its abstract and citation count.
    fixture: No checked debate map or source context is available.
    expected_primary: scholium-source-analysis
    expected_result: debate-importance-not-assessed
    invariants: [no-numeric-guess, author-self-positioning-not-independent-evidence, citation-count-not-importance, exact-context-needed]

  - id: debate-importance-corpus-calibration
    request: Reassess the Debate Importance of the selected Analyses so I can prioritize this large vault.
    fixture: The selected Analyses concern one named debate, but their existing ratings were assigned at different times against different partial maps.
    expected_primary: scholium-research-synthesis
    expected_result: bounded-common-scope-calibration
    invariants: [one-explicit-debate-scope, common-anchors, checked-comparative-context, insufficient-cases-not-assessed, old-new-differences-explained, no-reviewer-substitution, no-global-cross-debate-ranking, no-write-without-exact-analysis-authorization]

  - id: debate-importance-scoped-library-sort
    request: Show the most important Analyses in this named debate first.
    fixture: The Library is filtered to one exact debate_importance_scope and some matching Analyses have no warranted rating.
    expected_result: scoped-descending-importance-order
    invariants: [scope-filter-required, numeric-not-lexical-order, unrated-not-fabricated, unrated-after-rated, title-tiebreak, no-cross-scope-comparison]

  - id: source-analysis-three-pass
    request: Produce a full philosophical analysis of this complete paper.
    fixture: The full stable paper and reliable pagination are available.
    expected_primary: scholium-source-analysis
    expected_result: reviewed-three-pass-analysis
    invariants: [complete-analysis-unit-defined, orientation-before-reconstruction, second-complete-traversal, third-source-grounded-review, analytical-draft-revised-before-output, review-pass-not-peer-review, no-full-source-claim-if-any-pass-incomplete]

  - id: source-analysis-partial-three-pass
    request: Analyze the available excerpt even though the complete source is unavailable.
    fixture: Only a stable excerpt is available; the omitted sections may contain qualifications or replies.
    expected_primary: scholium-source-analysis
    expected_result: provisional-three-pass-analysis-of-available-unit
    invariants: [available-unit-defined, three-distinct-passes-over-available-material, omitted-material-explicit, no-full-source-claim, no-invented-objection-or-reply]

  - id: edited-volume-source-cluster
    request: Analyze every authored chapter in this edited collection and keep the work resumable.
    expected_primary: scholium-source-analysis
    expected_reference: references/source-clusters.md
    expected_result: sequential-independent-analyses-with-ephemeral-ledger
    invariants: [introduction-treated-as-framing-unless-argumentative, chapters-not-merged, three-passes-per-unit, resume-from-last-validated-item, synthesis-separate]

  - id: source-handoff-bridge
    request: Use this analyzed source to update the selected Topic with the objection it genuinely supports.
    expected_mode: mixed
    expected_phases: [analyze, integrate, audit]
    invariants: [source-bridge-packet, stable-locator, verification-state, attribution-limit, what-not-evidence-for, difference-preserved]

  - id: practice-conflict
    request: Review this interpretation using two selected Practices with incompatible standards of authorial intention.
    expected_primary: scholium-philosophical-review
    expected_result: methodological-conflict-preserved
    invariants: [no-last-loaded-wins, no-false-consensus, researcher-decision-identified]

  - id: selected-practice-overlay
    request: Develop this concept using my selected Conceptual Analyst Practice.
    fixture: The researcher-owned Practice has a recorded stable ID and revision.
    expected_primary: scholium-philosophical-development
    expected_researcher: [scholium-philosophical-practices]
    expected_result: official-development-with-selected-practice-overlay
    invariants: [official-method-loaded, selected-practice-only, practice-id-and-revision-recorded, no-permission-expansion, no-hidden-method-replacement]

  - id: writing-prose-control
    request: Improve the clarity and flow of this passage without changing my philosophical position.
    expected_primary: scholium-philosophical-writing
    expected_researcher: [scholium-prose-control]
    expected_result: thesis-preserving-prose-revision
    invariants: [researcher-owned-method-selected, exact-package-revision, preservation-ledger, no-thesis-change, no-concept-or-inference-drift, no-source-role-change, substantive-repairs-separated, no-automatic-activation]

  - id: load-bearing-definition-change
    request: Compare this revised definition with the current one and show what adopting it would change across the paper.
    expected_primary: scholium-philosophical-development
    expected_reference: references/definition-impact.md
    invariants: [old-new-comparison, affected-arguments-and-sources, objections-traced, revision-cost, drift-risk, researcher-decision]

  - id: private-manuscript-external-verification
    request: Search online for whether my unpublished original formulation is novel.
    fixture: A safe public query would still reveal the private contribution.
    expected_system: [scholium-core-protocol]
    expected_result: externalization-refused-with-verification-limit
    invariants: [no-private-prose-transmission, no-project-labels, no-advisor-feedback, explicit-external-boundary]

  - id: manuscript-readiness
    request: Take this philosophical paper through the remaining work and tell me whether it is ready to submit.
    expected_primary: scholium-manuscript-workflow
    expected_mode: mixed
    invariants: [ordinary-workflows-selected-narrowly, phase-permission-reset, final-fingerprint-audited-once, independent-review-distinct, evidence-state-separate, no-submission-action, researcher-decides]
    strongest_allowed_verdict: ready-for-researcher-submission-decision

  - id: duplicated-practice-package
    request: Adopt the bundled Philosophical Practices package into this Triptych and use my edited Reviewer reference.
    expected_result: independent-triptych-package-with-complete-resources
    invariants: [new-skill-id, references-copied, package-revision-recorded, local-resource-retrieval, no-release-overwrite]

  - id: audit-deduplication
    request: Complete the planned Mixed workflow.
    fixture: Writing and integration both mark the same final fingerprint and audit scope as audit-needed.
    expected_phases: [write, integrate, audit]
    invariants: [one-audit-for-final-fingerprint, audit-does-not-schedule-itself]

  - id: mixed-permission-isolation
    request: Analyze the source, suggest a revised argument, and edit only the named Work section.
    expected_mode: mixed
    invariants: [analysis-read-only, development-candidate-only, write-exact-target-only, permission-reset-between-phases]

  - id: workspace-bootstrap-success
    request: Use the copied Scholium bootstrap to create the initial AGENTS.md for this Triptych agent workspace.
    fixture: The Triptych and target are explicit, no AGENTS.md governs the target, and the bootstrap exists as a task-created temporary file.
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: validated-researcher-owned-agents-file-and-bootstrap-cleanup
    invariants: [stable-triptych-selector, fixed-minimal-contract, no-method-duplication, read-back-before-success, delete-only-task-bootstrap, protected-reference-retained]

  - id: workspace-bootstrap-existing-instructions
    request: Create the initial AGENTS.md here from the Scholium bootstrap.
    fixture: An AGENTS.md in an ancestor already governs the requested target.
    expected_result: stop-and-report-existing-instruction
    invariants: [no-overwrite, no-shadow-file, no-implicit-merge, bootstrap-retained]

  - id: workspace-bootstrap-validation-failure
    request: Finish setting up the workspace AGENTS.md.
    fixture: The candidate contains an unresolved Triptych placeholder and cannot pass validation.
    expected_result: no-agents-promotion-and-bootstrap-retained
    invariants: [no-partial-agents-file, task-candidate-cleanup-only, bootstrap-not-deleted-on-failure, exact-failure-reported]
