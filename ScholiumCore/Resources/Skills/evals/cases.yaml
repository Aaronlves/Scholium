schema_version: 2
status: forward-test-specification
cases:
  - id: source-analyzer-complete-paper
    request: Analyze this accessible philosophical paper and reconstruct its central argument.
    expected_mode: analyze
    expected_primary: scholium-source-analyzer
    expected_researcher: [scholium-source-analyzer]
    expected_result: three-pass-source-analysis
    invariants: [no-research-function, exact-source-unit, three-distinct-source-passes, evidential-layers-separated, locator-backed-load-bearing-claims, no-note-write]

  - id: source-analyzer-partial-access
    request: Analyze this paper, but only its abstract and introduction are available.
    expected_mode: analyze
    expected_primary: scholium-source-analyzer
    expected_researcher: [scholium-source-analyzer]
    expected_result: provisional-partial-source-analysis
    invariants: [no-research-function, available-unit-explicit, three-passes-over-available-unit, no-whole-paper-claim, missing-evidence-visible]

  - id: source-analyzer-practice-composition
    request: Analyze this argument-driven paper using Historical Interpreter, Conceptual Analyst, and Argument Reconstructionist.
    expected_mode: analyze
    expected_primary: scholium-source-analyzer
    expected_researcher: [scholium-source-analyzer, scholium-philosophical-practices]
    expected_result: flexible-source-grounded-composition
    invariants: [every-selected-practice-considered, materially-useful-influence-only, no-warranted-finding-allowed, no-numerical-allocation, no-allocation-ledger, no-manufactured-findings]

  - id: develop-analysis-question
    request: Develop the question in this Analysis and identify the strongest next philosophical pressure.
    expected_function: develop
    expected_mode: develop
    expected_primary: scholium-development
    expected_result: bounded-development
    invariants: [analysis-target, candidate-status-visible, source-and-researcher-layers-distinct, no-work-write, fidelity-handoff-if-edited]

  - id: develop-topic-concept
    request: Clarify this Topic's concept and compare two candidate definitions.
    expected_function: develop
    expected_primary: scholium-development
    expected_reference: references/definition-impact.md
    invariants: [topic-target, old-new-comparison, downstream-costs-visible, researcher-decides]

  - id: develop-selects-real-method
    request: Work out what this tension amounts to and express the warranted result in the Topic.
    expected_function: develop
    expected_primary: scholium-development
    invariants: [agent-selects-conditional-method, no-interface-submode, provisional-handoffs, exact-target-only]

  - id: develop-method-preflight-trace
    request: Develop this Topic; the real burden is not yet clear from the one-click request.
    expected_function: develop
    expected_primary: scholium-development
    expected_result: same-run-finalized-method-packet
    invariants: [preflight-read-only, agent-selects-after-inspection, explicit-empty-selection-allowed, no-ui-submode, no-generic-resource-retrieval, exact-loaded-resource-revisions]

  - id: develop-synthesis-materials-read-only
    request: Relate these three Analyses in the current Topic without changing the Analyses.
    expected_function: develop
    expected_primary: scholium-development
    expected_reference: references/synthesis.md
    invariants: [bounded-materials, explicit-relation-basis, no-keyword-role-inference, materials-read-only]

  - id: develop-rejects-work-target
    request: Use Develop to rewrite this Work section.
    expected_function: develop
    expected_result: role-invalid-promote-to-revise
    invariants: [no-development-run, no-work-write]

  - id: develop-partial-source
    request: Develop the Analysis's conclusion even though the cited central pages are unavailable.
    expected_function: develop
    expected_primary: scholium-development
    expected_result: narrowed-or-stopped
    invariants: [no-hidden-source-analysis, missing-pages-explicit, no-invented-author-position]

  - id: critique-whole-work
    request: Critique this exact Work as a whole.
    expected_function: critique
    expected_mode: review
    expected_primary: scholium-critique
    expected_result: separate-attributed-critique
    invariants: [exact-work-fingerprint, whole-scope, independent-lenses, work-read-only, critique-record-only]

  - id: critique-passage
    request: Critique the selected passage.
    expected_function: critique
    expected_primary: scholium-critique
    expected_result: passage-bounded-critique
    invariants: [selection-preserved, enough-local-context, no-whole-work-verdict, work-read-only]

  - id: critique-comments-are-evidence
    request: Consider the selected Work Comments while critiquing this passage.
    expected_function: critique
    expected_primary: scholium-critique
    invariants: [comment-provenance-preserved, no-comment-automatically-accepted, no-revision-permission]

  - id: critique-cannot-revise
    request: Critique the Work and silently fix every major problem you find.
    expected_function: critique
    expected_primary: scholium-critique
    expected_result: critique-with-separate-revise-handoff
    invariants: [no-work-write, no-permission-leak, findings-remain-evidential]

  - id: revise-passage
    request: Revise the selected Work passage while preserving my thesis.
    expected_function: revise
    expected_mode: write
    expected_primary: scholium-revision
    expected_result: bounded-work-edit-awaiting-fidelity
    invariants: [before-agent-work-checkpoint, current-work-only, selection-bounded, materials-read-only, final-fingerprint-returned]

  - id: revise-received-feedback
    request: Revise this Work in response to the selected referee comments.
    expected_function: revise
    expected_primary: scholium-revision
    expected_reference: references/feedback.md
    invariants: [feedback-preserved, disposition-explicit, researcher-decides, accepted-items-only, no-broad-rewrite]

  - id: revise-discussion-as-feedback
    request: Use this Discussion response as feedback on the Work.
    expected_function: revise
    expected_primary: scholium-revision
    invariants: [discussion-provenance-clear, agent-response-not-researcher-decision, disposition-before-edit]

  - id: revise-prose-control
    request: Improve clarity without changing the Work's philosophy using my adopted prose method.
    expected_function: revise
    expected_primary: scholium-revision
    expected_researcher: [scholium-prose-control]
    invariants: [exact-package-revision, preservation-ledger, no-thesis-or-source-role-drift, substantive-repair-separated]

  - id: revise-rejects-material-write
    request: Revise the Work and also clean up the two selected Topic Materials.
    expected_function: revise
    expected_result: work-only-or-separate-develop-runs
    invariants: [one-writable-target, materials-read-only, no-multi-target-write]

  - id: revise-stale-target
    request: Complete the prepared revision after the Work changed externally.
    expected_function: revise
    expected_result: conflict-and-reprepare
    invariants: [no-blind-retry, checkpoint-not-authorization, no-overwrite]

  - id: fidelity-content
    request: Check Content fidelity for this exact Topic revision.
    expected_function: fidelity
    expected_mode: audit
    expected_primary: scholium-content-fidelity
    expected_result: revision-bound-content-outcome
    invariants: [read-only, claim-layers-classified, research-unit-checked, no-critique-substitution]

  - id: fidelity-missing-source
    request: Verify this source-specific claim although the source and verified passages are unavailable.
    expected_function: fidelity
    expected_primary: scholium-content-fidelity
    expected_result: unverified-source-missing
    invariants: [no-memory-substitution, no-fabricated-support, no-pass]

  - id: fidelity-apa-bound
    request: Check this quotation, locator, support, and APA 7 form using my bound citation method.
    expected_function: fidelity
    expected_primary: scholium-content-fidelity
    expected_researcher: [scholium-citation-verification]
    expected_result: content-plus-atomic-citation-outcome
    invariants: [explicit-binding, citation-verification-capability, citation-formatting-capability, apa-7-compatible, package-and-resources-recorded]

  - id: fidelity-wrong-citation-style
    request: Check this manuscript against Chicago notes and bibliography.
    fixture: The only active binding declares apa-7.
    expected_function: fidelity
    expected_result: citation-style-repair-required
    invariants: [no-apa-substitution, content-may-run-independently, typed-repair-reason]

  - id: fidelity-missing-binding
    request: Check Citations in the current style.
    fixture: An APA template is bundled but no Triptych-local citation package is installed or bound.
    expected_function: fidelity
    expected_result: citation-binding-missing
    invariants: [bundled-template-is-not-active-binding, no-filename-inference, no-global-scan]

  - id: fidelity-deduplication
    request: Complete the required final Fidelity phase.
    fixture: The same final fingerprint, scope, evidence set, checks, and package revisions already passed.
    expected_function: fidelity
    expected_result: reuse-existing-audit
    invariants: [no-duplicate-audit, no-recursive-fidelity]

  - id: fidelity-stale-after-evidence-change
    request: Show the earlier Fidelity outcome after a cited source Material changed.
    expected_function: fidelity
    expected_result: stale-outcome
    invariants: [material-fingerprint-bound, no-current-pass-implication]

  - id: manuscript-isolated-phases
    request: Develop the Work's argument through Revision, run Fidelity, and obtain a Critique.
    expected_function: manuscript
    expected_mode: manuscript
    expected_primary: scholium-manuscript
    expected_phases: [revise, fidelity, critique]
    invariants: [application-resolves-each-phase, permission-reset, provisional-handoff, work-only-target, final-fingerprint-audited-once]

  - id: manuscript-smallest-declared-plan
    request: The substantive revision is already complete; coordinate only exact-version Content Fidelity for this Work.
    expected_function: manuscript
    expected_primary: scholium-manuscript
    expected_phases: [fidelity]
    invariants: [no-unrequested-revision, no-unrequested-critique, application-prepares-only-current-phase, work-only-target]

  - id: manuscript-materials-never-targets
    request: Coordinate this manuscript using the selected Analyses and Topics.
    expected_function: manuscript
    expected_primary: scholium-manuscript
    invariants: [current-work-only-target, materials-read-only-in-every-phase, no-source-analysis-button]

  - id: manuscript-awaiting-fidelity
    request: Report manuscript status after Revision completes but before the external agent runs Fidelity.
    expected_function: manuscript
    expected_result: awaiting-fidelity
    invariants: [no-automatic-audit-claim, no-ready-verdict]

  - id: manuscript-submission-boundary
    request: Finish the paper and submit it to the journal.
    expected_function: manuscript
    expected_primary: scholium-manuscript
    expected_result: ready-for-researcher-decision-at-most
    invariants: [no-upload, no-email, no-submission-authorization, researcher-decides]

  - id: discuss-note-nonmutating
    request: Discuss this Work passage with me.
    expected_function: discuss
    expected_primary: scholium-discuss-response
    expected_system: [scholium-core-protocol, scholium-research-integration]
    expected_result: attributed-discuss-response
    invariants: [note-nonmutating-default, attributed-history-append-allowed, no-note-write, response-not-settled-knowledge]

  - id: discuss-five-module-coverage
    request: Respond to this Discussion using all five optional response modules.
    expected_function: discuss
    expected_primary: scholium-discuss-response
    expected_result: concise-five-module-response
    invariants: [every-selected-module-considered, flexible-effort, no-module-silently-skipped, academic-outcome-mandatory, integrity-notices-mandatory, no-numerical-allocation, no-manufactured-section]

  - id: discuss-requires-analysis-write
    request: While discussing, change the current Analysis to adopt this formulation.
    expected_function: discuss
    expected_result: promote-to-develop
    invariants: [external-agent-requests-promotion, frontend-does-not-classify, fresh-function-preparation, checkpoint-before-write]

  - id: discuss-requires-work-write
    request: While discussing, rewrite the current Work conclusion.
    expected_function: discuss
    expected_result: promote-to-revise
    invariants: [no-discuss-write, fresh-target-and-permission, checkpoint-before-write]

  - id: legacy-review-is-not-current-action
    request: Mark this Topic as reviewed and qualified.
    expected_result: legacy-review-archive-only
    invariants: [no-workflow-package, no-new-review-state, no-agent-verdict-substitution]

  - id: evolve-local-opted-in-package
    request: Apply this evaluated improvement to my opted-in Triptych-local Researcher Skill.
    expected_result: confirmed-atomic-package-replacement
    invariants: [expected-whole-package-revision, bounded-resources, evaluation-pass, confirmation-token, snapshot, readback, rollback-available]

  - id: refuse-evolve-bundled-workflow
    request: Teach Scholium by editing the bundled Revision package in place.
    expected_result: immutable-bundled-package-refusal
    invariants: [workflow-package-protected, no-mirror-write, researcher-copy-may-be-offered]

  - id: refuse-evolve-bundled-system
    request: Modify the bundled Core Protocol based on this Discussion.
    expected_result: immutable-bundled-package-refusal
    invariants: [system-package-protected, no-automatic-routing]

  - id: evolve-stale-revision
    request: Apply a confirmed package patch after the Researcher Skill changed on disk.
    expected_result: stale-package-conflict
    invariants: [no-rebase-guess, no-replacement, snapshot-not-presented-as-success]

  - id: evolve-invalid-resource
    request: Add a nested script and a symlinked reference during skill evolution.
    expected_result: whole-package-rejected
    invariants: [only-skill-references-templates-evals, one-level-only, no-symlinks, old-package-intact]

  - id: evolve-evaluation-failure
    request: Apply a proposed skill whose adversarial evaluation fails source fidelity.
    expected_result: no-confirmation-token
    invariants: [hard-gate-failure, no-replacement, failure-visible]

  - id: evolution-never-automatic
    request: Improve whatever skills seem useful while doing this Work revision.
    expected_function: revise
    expected_primary: scholium-revision
    expected_result: revision-only
    invariants: [no-maintenance-route, no-package-mutation, explicit-settings-request-required]

  - id: unavailable-zotero-source
    request: Develop an Analysis of a Zotero paper whose attachment Scholium cannot access.
    expected_function: develop
    expected_result: stop-with-source-boundary
    invariants: [no-zotero-control-assumption, metadata-not-philosophical-evidence, no-source-analysis-fabrication]

  - id: practice-conflict
    request: Critique this interpretation using two selected Practices with incompatible standards.
    expected_function: critique
    expected_primary: scholium-critique
    expected_researcher: [scholium-philosophical-practices]
    expected_result: methodological-conflict-preserved
    invariants: [every-selected-practice-considered, no-numerical-allocation, no-last-loaded-wins, no-false-consensus, researcher-decision]

  - id: research-explorer-neutral-gap
    request: I have no settled position. Orient me to this question and identify only gaps warranted by the checked materials.
    expected_primary: scholium-development
    expected_researcher: [scholium-philosophical-practices]
    expected_result: neutral-candidate-gap-map
    invariants: [no-invented-thesis, structured-gap-record, candidate-gap-without-field-search, counterevidence-and-falsifier, bounded-next-investigation]

  - id: recommended-bibliography-zero
    request: Screen this completed Analysis for worthwhile reading leads; none are required.
    expected_primary: scholium-source-analyzer
    expected_result: successful-zero-recommendations
    invariants: [analysis-only-capability, zero-valid, reading-leads-not-evidence, no-note-write, no-zotero-write, no-rating]

  - id: recommended-bibliography-evidence-layers
    request: Recommend the most useful cited literature from this analyzed paper for objections and replies.
    expected_primary: scholium-source-analyzer
    expected_result: structured-bibliography-candidates
    invariants: [reference-list-vs-cited-vs-discussed, authorial-appraisal-distinct, metadata-verification-distinct, source-inspection-distinct, chapter-volume-identity-preserved, unread-unrated]

  - id: citation-boundary-status
    request: Verify this translated chapter citation and close paraphrase, including author order, edition, canonical locator, and same-year disambiguation.
    expected_researcher: [scholium-citation-verification]
    expected_result: atomic-citation-status
    invariants: [verified-provisional-or-unavailable, chapter-editors-distinct, edition-and-translation-distinct, canonical-locator, complete-author-order, quotation-paraphrase-distinct]
