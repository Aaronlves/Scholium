schema_version: 2
status: active
packages:
  - id: scholium-core-protocol
    name: Scholium Core Protocol
    description: Keep every Scholium task philosophy-facing, truth-pursuing, source-faithful, researcher-controlled, and oriented toward a precise, reviewable knowledge base.
    class: system
    role: protocol
    version: 0.6.0-draft
    supported_modes: [all, mixed]
    automatic_modes: [all]
    required_skills: []
    update_policy: release-managed-protected
    path: Scholium System Skills/scholium-core-protocol

  - id: scholium-research-integration
    name: Scholium Research Integration
    description: Connect philosophical workflows to configured Triptychs through protected reads, bounded durable updates, Research Unit and status changes, and scholarly Dialogue replies.
    class: system
    role: application-adapter
    version: 0.4.0-draft
    supported_modes: [all]
    automatic_modes: []
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-protected
    path: Scholium System Skills/scholium-research-integration

  - id: scholium-dialogue-response
    name: Scholium Dialogue Response
    description: Resolve a Dialogue's request-scoped response contract, compose selected scholarly response modules, and persist one concise attributed Response.
    class: system
    role: protocol
    version: 0.2.0-draft
    supported_modes: [all]
    automatic_modes: [dialogue]
    required_skills: [scholium-core-protocol, scholium-research-integration]
    update_policy: release-managed-protected
    path: Scholium System Skills/scholium-dialogue-response

  - id: scholium-zotero-integration
    name: Scholium Zotero Integration
    description: Supply bounded research-library retrieval and explicitly requested guarded imports without treating bibliographic metadata as philosophical evidence.
    class: system
    role: application-adapter
    version: 0.2.0-draft
    supported_modes: [all]
    automatic_modes: []
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-protected
    path: Scholium System Skills/scholium-zotero-integration

  - id: scholium-research-exploration
    name: Scholium Research Exploration
    description: Identify promising philosophical questions, tensions, stakes, and bounded next directions.
    class: workflow
    role: workflow
    version: 0.2.0-draft
    supported_modes: [explore]
    compatible_practices: [research-explorer, historical-interpreter, conceptual-analyst, systematizer]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-research-exploration

  - id: scholium-source-analysis
    name: Scholium Source Analysis
    description: Reconstruct and evaluate bounded source units through distinct Orientation, Analytical, and Review passes, with cumulative source-level Analysis support for long works.
    class: workflow
    role: workflow
    version: 0.7.0-draft
    supported_modes: [analyze]
    compatible_practices: [historical-interpreter, conceptual-analyst, argument-reconstructionist]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-source-analysis

  - id: scholium-philosophical-development
    name: Scholium Philosophical Development
    description: Develop concepts, arguments, objections, replies, and candidate positions.
    class: workflow
    role: workflow
    version: 0.2.0-draft
    supported_modes: [develop]
    compatible_practices: [conceptual-analyst, argument-reconstructionist, dialectical-partner, historical-interpreter, systematizer, thesis-architect]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-philosophical-development

  - id: scholium-philosophical-review
    name: Scholium Philosophical Review
    description: Conduct independent version-bound philosophical evaluation and prioritize revision burdens.
    class: workflow
    role: workflow
    version: 0.3.0-draft
    supported_modes: [review]
    compatible_practices: [reviewer]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-philosophical-review

  - id: scholium-philosophical-writing
    name: Scholium Philosophical Writing
    description: Plan, draft, substantively revise, or explain philosophical prose while preserving or explicitly negotiating the researcher's thesis and substantive commitments.
    class: workflow
    role: workflow
    version: 0.3.0-draft
    supported_modes: [write]
    compatible_practices: [thesis-architect, philosophical-expositor, systematizer, conceptual-analyst, dialectical-partner]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-philosophical-writing

  - id: scholium-research-synthesis
    name: Scholium Research Synthesis
    description: Organize a bounded analyzed corpus into evidenced concepts, arguments, relations, tensions, and open questions.
    class: workflow
    role: workflow
    version: 0.3.0-draft
    supported_modes: [synthesize]
    compatible_practices: [systematizer, research-explorer, conceptual-analyst, historical-interpreter, argument-reconstructionist]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-research-synthesis

  - id: scholium-feedback-processing
    name: Scholium Feedback Processing
    description: Preserve received feedback, assign dispositions, and produce bounded revision work.
    class: workflow
    role: workflow
    version: 0.2.0-draft
    supported_modes: [feedback]
    compatible_practices: [reviewer, dialectical-partner, systematizer]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-feedback-processing

  - id: scholium-content-audit
    name: Scholium Content Audit
    description: Audit an exact philosophical version for fidelity, accuracy, reconstruction, and evidential-role defects.
    class: workflow
    role: specialist
    version: 0.4.0-draft
    supported_modes: [audit]
    compatible_practices: [historical-interpreter, conceptual-analyst, argument-reconstructionist, reviewer]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-content-audit

  - id: scholium-manuscript-workflow
    name: Scholium Manuscript Workflow
    description: Coordinate a bounded philosophical manuscript from research question through source work, development, writing, audit, independent review, feedback, and researcher-controlled submission readiness.
    class: workflow
    role: workflow
    version: 0.2.0-draft
    supported_modes: [manuscript]
    compatible_practices: [thesis-architect, philosophical-expositor, systematizer, reviewer]
    required_skills: [scholium-core-protocol]
    update_policy: release-managed-duplicable
    path: Scholium Workflow Skills/scholium-manuscript-workflow

  - id: scholium-philosophical-practices
    name: Scholium Philosophical Practices
    description: Provide an editable researcher-owned library of philosophical Practice references.
    class: researcher
    role: practice
    version: 0.4.0-template
    supported_modes: [explore, analyze, develop, review, write, synthesize, feedback, audit, manuscript]
    required_skills: [scholium-core-protocol]
    practice_resources:
      research-explorer: references/Research-Explorer.md
      historical-interpreter: references/Historical-Interpreter.md
      conceptual-analyst: references/Conceptual-Analyst.md
      argument-reconstructionist: references/Argument-Reconstructionist.md
      dialectical-partner: references/Dialectical-Partner.md
      systematizer: references/Systematizer.md
      thesis-architect: references/Thesis-Architect.md
      philosophical-expositor: references/Philosophical-Expositor.md
      reviewer: references/Reviewer.md
    update_policy: copy-on-adoption-researcher-owned
    path: Researcher Skills/scholium-philosophical-practices

  - id: scholium-prose-control
    name: Scholium Prose Control
    description: Provide an editable researcher-owned method for improving philosophical prose without changing its substantive commitments.
    class: researcher
    role: specialist
    version: 0.1.0-template
    supported_modes: [write]
    required_skills: [scholium-core-protocol, scholium-philosophical-writing]
    update_policy: copy-on-adoption-researcher-owned
    path: Researcher Skills/scholium-prose-control

  - id: scholium-citation-verification
    name: Citation Verification — APA 7 Starter
    description: Provide an editable researcher-owned starter for metadata, quotation, locator, atomic source-support, and APA 7 checks.
    class: researcher
    role: specialist
    version: 0.1.0-template
    supported_modes: [all]
    required_skills: [scholium-core-protocol]
    update_policy: copy-on-adoption-researcher-owned
    path: Researcher Skills/scholium-citation-verification
